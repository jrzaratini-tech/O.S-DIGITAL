<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f6f54">
    <title>O.S Digital Print Pixel</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SG-CV</p>
          <h1>O.S Digital Print Pixel</h1>
        </div>
        <div class="user-box">
          <span id="userName">Aguardando login</span>
          <button id="logoutButton" class="ghost-button" type="button" hidden>Sair</button>
        </div>
      </header>

      <section id="authView" class="auth-panel">
        <div>
          <p class="eyebrow">Acesso seguro</p>
          <h2 id="authTitle">Entrar no sistema</h2>
          <p id="authText">Use o e-mail e senha cadastrados no Firebase.</p>
        </div>
        <form id="authForm" class="auth-form">
          <label id="nameField" hidden>
            Nome completo
            <input id="authName" autocomplete="name" placeholder="Nome do montador">
          </label>
          <label>
            E-mail
            <input id="authEmail" required type="email" autocomplete="email" placeholder="email@empresa.com">
          </label>
          <label>
            Senha
            <input id="authPassword" required type="password" autocomplete="current-password" minlength="6" placeholder="Minimo 6 caracteres">
          </label>
          <button id="authSubmit" class="primary-button" type="submit">Entrar</button>
          <button id="forgotPasswordButton" class="ghost-button" type="button">Recuperar senha</button>
        </form>
        <div id="authMessage" class="notice" hidden></div>
      </section>

      <div id="appView" hidden>
        <nav class="tabs" aria-label="Navegacao principal">
          <button class="tab is-active" data-view="fila" type="button">Fila</button>
          <button class="tab" data-view="nova" type="button">Nova OS</button>
          <button class="tab" data-view="equipe" type="button">Equipe</button>
          <button class="tab" data-view="calendario" type="button">Calendario</button>
          <button class="tab" data-view="metricas" type="button">Metricas</button>
        </nav>

        <main>
          <section id="view-fila" class="view is-active" aria-labelledby="filaTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Producao</p>
                <h2 id="filaTitle">Fila operacional</h2>
              </div>
              <div class="filters" role="search">
                <input id="searchInput" type="search" placeholder="Buscar cliente, OS ou observacao">
                <select id="statusFilter" aria-label="Filtrar status">
                  <option value="todos">Todos os status</option>
                  <option value="Aguardando projeto">Aguardando projeto</option>
                  <option value="Em projeto">Em projeto</option>
                  <option value="Em montagem">Em montagem</option>
                  <option value="Concluido">Concluido</option>
                </select>
              </div>
            </div>
            <div id="permissionBanner" class="notice" hidden></div>
            <div id="queueSummary" class="summary-grid"></div>
            <div id="serviceList" class="service-list"></div>
          </section>

          <section id="view-nova" class="view" aria-labelledby="formTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Cadastro</p>
                <h2 id="formTitle">Ordem de servico</h2>
              </div>
              <button id="resetFormButton" class="ghost-button" type="button">Limpar</button>
            </div>
            <form id="serviceForm" class="form-grid">
              <input id="editingId" type="hidden">
              <label>
                Cliente
                <input id="clientName" required autocomplete="organization" placeholder="Nome do cliente">
              </label>
              <label>
                Tipo de produto
                <select id="productType" required>
                  <option value="Luz Frontal">Letreiro com Luz Frontal</option>
                  <option value="Logo Flutuante">Logo Flutuante</option>
                  <option value="Neon">Letreiro em Neon</option>
                </select>
              </label>
              <label>
                Entrega prometida
                <input id="deliveryDate" required type="date">
              </label>
              <label>
                Medidas do letreiro
                <input id="dimensions" placeholder="Ex.: 300cm x 80cm">
              </label>
              <label class="wide">
                Observacoes
                <textarea id="notes" rows="4" placeholder="Fixacao, material, acabamento, local de instalacao..."></textarea>
              </label>
              <label class="wide">
                Arquivos de referencia
                <input id="attachments" type="file" multiple>
                <span class="field-help">Os nomes ficam registrados na OS. Para arquivos reais, ative Firebase Storage depois.</span>
              </label>
              <label class="wide">
                Responsavel pela montagem
                <select id="assignedMountingUid">
                  <option value="">Sem montador definido</option>
                </select>
              </label>
              <label class="switch-row">
                <input id="superPriority" type="checkbox">
                <span>Super Prioridade de Producao</span>
              </label>
              <div class="form-actions">
                <button id="deleteButton" class="danger-button" type="button" hidden>Excluir OS</button>
                <button class="primary-button" type="submit">Salvar OS</button>
              </div>
            </form>
          </section>

          <section id="view-equipe" class="view" aria-labelledby="teamTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Convites</p>
                <h2 id="teamTitle">Equipe de montagem</h2>
              </div>
            </div>
            <form id="inviteForm" class="form-grid">
              <label>
                Nome do colaborador
                <input id="inviteName" required placeholder="Ex.: Carlos da montagem">
              </label>
              <div class="form-actions">
                <button class="primary-button" type="submit">Gerar link exclusivo</button>
              </div>
            </form>
            <div id="inviteResult" class="notice" hidden></div>
            <div id="teamList" class="audit-list"></div>
          </section>

          <section id="view-calendario" class="view" aria-labelledby="calendarTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Agenda</p>
                <h2 id="calendarTitle">Entregas por data</h2>
              </div>
              <input id="monthPicker" type="month" aria-label="Selecionar mes">
            </div>
            <div id="calendarGrid" class="calendar-grid"></div>
          </section>

          <section id="view-metricas" class="view" aria-labelledby="metricsTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Auditoria</p>
                <h2 id="metricsTitle">Timestamps e desempenho</h2>
              </div>
              <button id="exportButton" class="ghost-button" type="button">Exportar JSON</button>
            </div>
            <div id="metricsGrid" class="summary-grid"></div>
            <div id="auditList" class="audit-list"></div>
          </section>
        </main>
      </div>
    </div>

    <dialog id="serviceDialog" class="service-dialog">
      <div id="serviceDetail"></div>
      <form method="dialog">
        <button class="primary-button" value="close">Fechar</button>
      </form>
    </dialog>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <strong>Nenhuma OS encontrada.</strong>
        <span>Ajuste os filtros ou cadastre um novo servico.</span>
      </div>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
